[package]
name = "blog-benchmark"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SiaFoundation/blog-benchmark"
description = "Upload and download benchmarks for the Sia storage SDK"

[dependencies]
aes = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctr = "0.10"
directories = "6"
env_logger = "0.11"
hex = "0.4"
indicatif = { version = "0.18", features = ["tokio"] }
log = "0.4"
rand = "0.10"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sia_storage = { git = "https://github.com/SiaFoundation/sia-sdk-rs", rev = "1be56320e1c7d2a31b9dfa0917261d1d9afe4c1b" }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
